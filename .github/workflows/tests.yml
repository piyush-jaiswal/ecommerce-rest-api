name: Tests

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        id: cp312
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      # for testing
      - name: Check cache hit
        run: echo "${{ steps.cp312.outputs.cache-hit }}" # true if cache-hit occurred on the primary key

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        env:
          SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
        run: |
          pytest --disable-warnings -q -rA
